<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="template.css">
</head>

<body>
    <div class="title">
        <h1 id="name">{name}</h1>
        
    </div>
    <div class="subtitle">
        <p>{subtitle}</p>
        <p class="vocal-component">{vocal}</p>
    </div>
    
    <div class="summary">
        <p><b>Casting Time:</b> {casting}</p>
        <p><b>Range:</b> {range}</p>
        <p><b>Components:</b> {components}</p>
        <p><b>Duration:</b> {duration}</p>
    </div>
    <hr>
    <div class="description">{description}</div>
    <footer>{source}</footer>
</body>

</html>
