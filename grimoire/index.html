<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h2>My Tool Dashboard</h2>
    <input type="text" id="username" placeholder="Enter your name">
    <button onclick="callPython()">Send to Python</button>
    <p id="output"></p>

    <script>
        function callPython() {
            const name = document.getElementById('username').value;
            // Wait for pywebview to load, then call the API class method
            window.pywebview.api.greet_user(name).then(response => {
                document.getElementById('output').innerText = response;
            });
        }
    </script>
</body>

</html>
