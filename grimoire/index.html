<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grimoire</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="header-title">Grimoire</h1>
      <p class="header-subtitle">D&D Spell Manager, powered by <a href="https://5e.tools/" target="_blank" rel="noopener noreferrer">5e.tools</a> data.</p>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Selected Spells Section -->
      <section class="section selected-section" aria-labelledby="selected-heading">
        <div class="section-header">
          <h2 id="selected-heading" class="section-title">Selected Spells</h2>
          <button onclick="exportAll()" class="btn btn-primary btn-export" aria-label="Export selected spells to PDF">
            All to PDF
          </button>
        </div>
        
        <div class="table-wrapper">
          <table id="selected-table" class="table">
            <thead>
              <tr>
                <th scope="col">Spell</th>
                <th scope="col">Source</th>
                <th scope="col">Level</th>
                <th scope="col">School</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="selected-table-list" class="table-body"></tbody>
          </table>
        </div>
      </section>

      <!-- Available Spells Section -->
      <section class="section available-section" aria-labelledby="available-heading">
        <h2 id="available-heading" class="section-title">Available Spells</h2>
        
        <!-- Filters -->
        <div class="filters" role="search" aria-label="Spell filters">
          <div class="search-container">
            <input 
              type="text" 
              id="spell-search" 
              class="search-input" 
              placeholder="Search spells by name..."
              oninput="filterSpells()"
              aria-label="Search spells"
            >
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
              <path
                d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z" />
            </svg>
          </div>
          
          <div class="filter-dropdowns">
            <div class="dropdown-container" id="class-filter-container" aria-label="Filter by class">
              <span class="loading-text">Loading classes...</span>
            </div>
            <div class="dropdown-container" id="level-filter-container" aria-label="Filter by level">
              <span class="loading-text">Loading levels...</span>
            </div>
            <div class="dropdown-container" id="school-filter-container" aria-label="Filter by school">
              <span class="loading-text">Loading schools...</span>
            </div>
          </div>
        </div>

        <!-- Spells Table -->
        <div class="table-wrapper">
          <table id="spells-table" class="table" style="display: none;">
            <thead>
              <tr>
                <th scope="col">Spell</th>
                <th scope="col">Source</th>
                <th scope="col">Level</th>
                <th scope="col">School</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="spells-table-list" class="table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="api.js"></script>
</body>

</html>
