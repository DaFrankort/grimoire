<!doctype html>
<html>

<head>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="selected">
    <h3>Selected Spells</h3>
    <button onclick="exportAll()" class="btn-pdf" >Selected to PDF</button>
    <table id="selected-table">
      <thead>
        <tr>
          <th>Spell</th>
          <th>Source</th>
          <th>Level</th>
          <th>School</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="selected-table-list"></tbody>
    </table>
  </div>

  <br>

  <div class="spells">
    <h3>Available Spells</h3>
    <button onclick="getSpells()">Load Spells</button>
    <table id="spells-table" style="display: none; margin-top: 15px">
      <thead>
        <tr>
          <th>Spell</th>
          <th>Source</th>
          <th>Level</th>
          <th>School</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="spells-table-list"></tbody>
    </table>
  </div>
  <script>
    function updateSelectedSpells(spells) {
      const tbody = document.getElementById("selected-table-list");
      const table = document.getElementById("selected-table");
      tbody.innerHTML = "";

      spells.forEach((spell) => {
        const row = document.createElement("tr");
        name = spell.name;
        if (spell.url) name = `<a href="${spell.url}" target="_blank" rel="noopener noreferrer">${spell.name}</a>`;
        row.innerHTML = `
                          <td>${name}</td>
                          <td>${spell.source}</td>
                          <td>${spell.level}</td>
                          <td>${spell.school}</td>
                          <td>
                              <button class="btn-pdf" onclick="downloadPdf('${spell.name.replace(/'/g, "\\'")}', '${spell.source}')">PDF</button>
                              <button class="btn-sub" onClick="deselectSpell('${spell.name.replace(/'/g, "\\'")}', '${spell.source}')">-</button>
                          </td>
                      `;
        tbody.appendChild(row);
      });
      table.style.display = "table";
      getSpells();
    }

    function exportAll() {
      window.pywebview.api.export_selected_to_pdf().then(message => {
        alert(message);
      });
    }

    function downloadPdf(name, source) {
      window.pywebview.api.export_spell_pdf(name, source).then(message => {
        alert(message);
      });
    }

    function selectSpell(name, source) {
      window.pywebview.api.select_spell(name, source).then(selected => {
        updateSelectedSpells(selected);
      })
    }

    function deselectSpell(name, source) {
      window.pywebview.api.deselect_spell(name, source).then(selected => {
        updateSelectedSpells(selected);
      })
    }

    function getSpells() {
      const tbody = document.getElementById("spells-table-list");
      const table = document.getElementById("spells-table");

      tbody.innerHTML = "";
      window.pywebview.api.fetch_spells().then((spells) => {
        spells.forEach((spell) => {
          const row = document.createElement("tr");
          name = spell.name;
          if (spell.url) name = `<a href="${spell.url}" target="_blank" rel="noopener noreferrer">${spell.name}</a>`;
          row.innerHTML = `
                            <td>${name}</td>
                            <td>${spell.source}</td>
                            <td>${spell.level}</td>
                            <td>${spell.school}</td>
                            <td>
                                <button class="btn-pdf" onclick="downloadPdf('${spell.name.replace(/'/g, "\\'")}', '${spell.source}')">PDF</button>
                                <button class="btn-add" onClick="selectSpell('${spell.name.replace(/'/g, "\\'")}', '${spell.source}')">+</button>
                            </td>
                        `;
          tbody.appendChild(row);
        });
        table.style.display = "table";
      });
    }

    getSpells()
  </script>
</body>

</html>
