<!doctype html>
<html>

<head>
  <link rel="stylesheet" href="styles.css" />
  <script src="api.js"></script>
</head>

<body>
  <div class="selected">
    <h3>Selected Spells</h3>
    <button onclick="exportAll()" class="btn-pdf">Selected to PDF</button>
    <table id="selected-table">
      <thead>
        <tr>
          <th>Spell</th>
          <th>Source</th>
          <th>Level</th>
          <th>School</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="selected-table-list"></tbody>
    </table>
  </div>

  <br>

  <div class="spells">
    <h3>Available Spells</h3>
    <!--<button onclick="getSpells()">Load Spells</button>-->
    <div class="search-container">
      <input type="text" id="spell-search" class="search-bar" placeholder="Search spells by name..."
        oninput="filterSpells()">
    </div>
    <table id="spells-table" style="display: none; margin-top: 15px">
      <thead>
        <tr>
          <th>Spell</th>
          <th>Source</th>
          <th>Level</th>
          <th>School</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="spells-table-list"></tbody>
    </table>
  </div>
</body>

</html>
