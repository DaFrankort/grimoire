name: CSPELL

on:
  push:
    branches: [main]
    paths:
      - "readme.md"
  pull_request:
    paths:
      - "README.md"
      - "**/*.py"
      - "**/*.html"
      - "**/*.css"
      - "cspell.json"
  workflow_dispatch:

jobs:
  spell-check:
    runs-on: ubuntu-latest
    name: cspell
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install cspell
        run: npm install -g cspell

      - name: Run spell check
        run: cspell --config cspell.json grimoire/**/*.py grimoire/*.py *.md
